[package]
name = "willow"
version = "0.5.0-alpha.0"
edition = "2024"
rust-version = "1.88"
publish = false
build = "build.rs"

[[bin]]
name = "willow"
harness = false

[dependencies]
embedded-graphics = "=0.8.2"
esp-idf-svc = { version = "=0.52.1", default-features = false, features = ["std"] }
esp-idf-sys = "=0.37.2"
log = "0.4"
ogg = "=0.9.2"
rusttype = { version = "=0.9.3", default-features = false, features = ["libm-math"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
willow-schema = { git = "https://github.com/HeyWillow/willow-schema.git", rev = "1622fcfb006b62763fe62b95e10f0b82bf454ba1" }

[build-dependencies]
embuild = "=0.33.1"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig = "sdkconfig"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]
esp_idf_tools_install_dir = "fromenv"
esp_idf_version = "tag:v5.3.4"
esp_idf_components = ["main"]

[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "bindings.h"

[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "audio_codec_bindings.h"
bindings_module = "audio_codec"

[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "esp_sr_bindings.h"
bindings_module = "esp_sr"

[profile.release]
debug = true
opt-level = "s"
